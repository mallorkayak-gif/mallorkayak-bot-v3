name: 🎣 MallorKayak Weather Bot + Validator

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run validator
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: python3 bot_validator.py
      
      - name: Run predictor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: python3 bot_predictions.py
      
      - name: Save predictions and validations
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Bot MallorKayak"
          git add predicciones/ validaciones/ 2>/dev/null || true
          git commit -m "📊 Guardadas predicciones y validaciones - $(date)" || true
          git push
