name: 🎣 MallorKayak Weather Bot + Validator

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run validator (comparar predicciones)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: python3 bot_validator.py || true
      
      - name: Run predictor (guardar predicciones)
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: python3 bot_predictions.py || true
      
      - name: Run bot (generar reporte)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: python3 bot_simple.py
      
      - name: Log execution
        run: echo "✅ Bot completado a las $(date)"
